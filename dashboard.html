<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFA Packet Detector Dashboard</title>
    <!-- ESP Web Tools Script for Flash Button -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #connectBtn {
            background-color: #0ea5e9;
            color: white;
        }

        #connectBtn:hover {
            background-color: #0284c7;
        }

        #connectBtn.connected {
            background-color: #ef4444;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #334155;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        #stateVal {
            color: #fbbf24;
        }

        .alert-banner {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.5s;
        }

        .safe {
            background-color: #059669;
            color: white;
        }

        .alert {
            background-color: #dc2626;
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
            }
        }

        .log-container {
            background: #000;
            color: #22c55e;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 8px;
            height: 150px;
            overflow-y: auto;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>🛡️ DFA Packet Sniffer Dashboard</h1>
    <div class="container">
        <div class="controls">
            <button id="connectBtn">Connect to ESP32 (USB)</button>
            <!-- New Flash Button -->
            <esp-web-install-button manifest="manifest.json" style="margin-left: 10px;">
                <button slot="activate" style="background-color: #ec4899; color: white;">Flash Firmware</button>
            </esp-web-install-button>
        </div>

        <div id="alertBanner" class="alert-banner safe">
            SYSTEM SECURE - MONITORING TRAFFIC
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Packets</span>
                <span id="packetVal" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">SYN Flags</span>
                <span id="synVal" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">WiFi Channel</span>
                <span id="channelVal" class="stat-value">1</span>
            </div>
        </div>
        <div class="stat-card" style="margin-bottom: 20px;">
            <span class="stat-label">DFA State</span>
            <span id="stateVal" class="stat-value">q0</span>
        </div>

        <div class="log-container" id="logBox">
            [READY] Click connect to start monitoring...
        </div>
    </div>

    <script>
        let port;
        let reader;
        const connectBtn = document.getElementById('connectBtn');
        const packetVal = document.getElementById('packetVal');
        const synVal = document.getElementById('synVal');
        const stateVal = document.getElementById('stateVal');
        const alertBanner = document.getElementById('alertBanner');
        const logBox = document.getElementById('logBox');

        async function connect() {
            if (port) {
                // Disconnect logic
                if (reader) await reader.cancel();
                await port.close();
                port = null;
                connectBtn.innerText = "Connect to ESP32 (USB)";
                connectBtn.classList.remove('connected');
                return;
            }

            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                connectBtn.innerText = "Disconnect";
                connectBtn.classList.add('connected');
                logBox.innerHTML += "<br>[CONNECTED] Reading serial data...";

                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                let partialLine = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    partialLine += value;
                    const lines = partialLine.split("\n");
                    partialLine = lines.pop(); // Keep last incomplete line

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith("{") && trimmed.endsWith("}")) {
                            try {
                                const data = JSON.parse(trimmed);
                                updateUI(data);
                            } catch (e) {
                                console.error("Parse error:", trimmed);
                            }
                        } else if (trimmed) {
                            logBox.innerHTML += `<br>> ${trimmed}`;
                            logBox.scrollTop = logBox.scrollHeight;
                        }
                    }
                }
            } catch (err) {
                console.error("Serial error:", err);
                alert("Could not connect to Serial port. Ensure you are using Chrome/Edge and your ESP32 is plugged in.");
            }
        }

        function updateUI(data) {
            if (data.ch) {
                const channelVal = document.getElementById('channelVal');
                channelVal.innerText = data.ch;
                return;
            }
            packetVal.innerText = data.p;
            synVal.innerText = data.s;
            stateVal.innerText = data.st;

            if (data.st === "q3") {
                alertBanner.innerText = "🚨 ALERT: SYN FLOOD DETECTED! 🚨";
                alertBanner.className = "alert-banner alert";
            } else if (data.st === "q0") {
                alertBanner.innerText = "SYSTEM SECURE - MONITORING TRAFFIC";
                alertBanner.className = "alert-banner safe";
            }
        }

        connectBtn.addEventListener('click', connect);
    </script>
</body>

</html>
